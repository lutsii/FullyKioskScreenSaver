<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Clock and Date</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: black;
            color: white;
            font-family: "Outfit", sans-serif;
            font-optical-sizing: auto;
            font-style: normal;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .clock {
            font-size: 15vw; /* Font size scales with viewport width */
            margin-bottom: 0rem;
            font-weight: 600;
        }
        .date {
            font-size: 4vw; /* Font size scales with viewport width */
            font-weight: 600;
        }

        .wlr {
            font-family: "Outfit", sans-serif!important;
            font-optical-sizing: auto;
            font-style: normal;
            font-weight: 600;
            position: absolute;
            top: 15px;
            right: 20px;
        }
    </style>
</head>
<body>
    <!-- Visit This URL https://sharpweather.com/widget/r/#c=cbkg=rgb(69,90,100)&c=codd=rgb(84,110,122) and edit your Weather Widget. Else, if you don't want it, delete or comment out this weather blo[...]

    <!-- Weather block Starts 
    <div id="id4167f8d5860c6" a='{"t":"r","v":"1.2","lang":"en","locs":[462],"ssot":"c","sics":"ms","cbkg":"#FFFFFF00","cfnt":"rgba(255,255,255,1)","codd":"#FFFFFF00","cont":"rgba(255,255,255,0.83)"}'[...]
    Weather block Ends -->


    <div class="clock" id="clock"></div>
    <div class="date" id="date"></div>

    <script>
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const day = new Intl.DateTimeFormat('en-US', { weekday: 'long' }).format(now);
            const date = now.toLocaleDateString('fi-FI');

            document.getElementById('clock').textContent = `${hours}:${minutes}`;
            document.getElementById('date').textContent = `${day}, ${date}`;
        }

        function scheduleNextUpdate() {
            const now = new Date();
            const secondsUntilNextMinute = 60 - now.getSeconds();
            
            setTimeout(() => {
                updateTime();
                setInterval(updateTime, 60000); // Now update every minute precisely
            }, secondsUntilNextMinute * 1000);
        }

        function toggleClockMargin() {
            const clockElement = document.querySelector('.clock');
            if (clockElement.style.marginBottom === '4rem') {
                clockElement.style.marginBottom = '0rem';
            } else {
                clockElement.style.marginBottom = '4rem';
            }
        }

        function toggleWeatherPosition() {
            const weatherElement = document.querySelector('.wlr');
            if (weatherElement.style.top === '25px') {
                weatherElement.style.top = '15px';
            } else {
                weatherElement.style.top = '25px';
            }
        }

        scheduleNextUpdate(); // Schedule first update to align with next minute boundary
        setInterval(toggleClockMargin, 5 * 60 * 1000); // Toggle margin every 5 minutes
        // setInterval(toggleWeatherPosition, 5 * 60 * 1000); // Toggle margin every 5 minutes
    </script>
</body>
</html>
